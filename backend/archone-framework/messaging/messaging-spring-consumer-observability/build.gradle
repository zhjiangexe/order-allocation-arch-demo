plugins {
    id 'java-library'
}

description = 'Micrometer observation decorator for semantic message consumption outcomes'

dependencies {
    api project(':archone-framework:messaging:messaging-consumer-common')
    api project(':archone-framework:messaging:messaging-spring-observability')

    testImplementation libs.micrometer.core
    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}
