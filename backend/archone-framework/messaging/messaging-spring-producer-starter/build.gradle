plugins {
    id 'java-library'
}

description = 'narrow Spring Boot starter for transactional Outbox producers'

dependencies {
    api project(':archone-framework:messaging:messaging-spring-boot-autoconfigure')
    api project(':archone-framework:messaging:messaging-events')
    api project(':archone-framework:messaging:messaging-producer-common')
    api project(':archone-framework:messaging:messaging-producer-jdbc')
    api project(':archone-framework:messaging:messaging-spring-jdbc')
    api project(':archone-framework:messaging:messaging-spring-producer-jdbc')
    api project(':archone-framework:messaging:messaging-spring-observability')
    api project(':archone-framework:messaging:messaging-spring-producer-observability')
    api libs.spring.boot.starter.jdbc
    api libs.jackson.databind

    testImplementation libs.spring.boot.starter.test
    testRuntimeOnly libs.junit.platform.launcher
}
