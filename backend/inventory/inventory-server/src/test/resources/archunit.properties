# 只有 BoundedContextArchitectureRules.DEFERRED_RULES 列出的延後處理規則會使用 freeze。
# 凍結檔記錄既有違規；新增違規一律失敗，修掉的違規會自動從凍結檔移除。
# 不允許自動建立新的凍結檔：新延後項目必須先在 README 的延後處理表登記，再暫時開啟產生。
freeze.store.default.path=src/test/resources/archunit-frozen-violations
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
