# jakarta.validation.constraints 內建 constraints
# {0}：本地化 request 欄位名稱；後續參數：依名稱排序的 annotation attributes
AssertFalse={0}必須為 false
AssertTrue={0}必須為 true
DecimalMax={0}必須{1,choice,0#小於 {2}|1#小於或等於 {2}}
DecimalMin={0}必須{1,choice,0#大於 {2}|1#大於或等於 {2}}
Digits={0}的整數部分最多 {2} 位，小數部分最多 {1} 位
Email={0}必須是格式正確的電子郵件地址
Future={0}必須是未來的日期或時間
FutureOrPresent={0}必須是現在或未來的日期或時間
Max={0}必須小於或等於 {1}
Min={0}必須大於或等於 {1}
Negative={0}必須小於 0
NegativeOrZero={0}必須小於或等於 0
NotBlank={0}不得為空白
NotEmpty={0}不得為空
NotNull={0}為必填
Null={0}必須為空值
Past={0}必須是過去的日期或時間
PastOrPresent={0}必須是過去或現在的日期或時間
Pattern={0}必須符合格式 {2}
Positive={0}必須大於 0
PositiveOrZero={0}必須大於或等於 0
Size={0}大小必須介於 {2} 到 {1} 之間
