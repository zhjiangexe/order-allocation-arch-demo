spring.application.name=order-promising

# host port 一律 2829x（見 e2e/perf/README.md）。SIT 用 RANDOM_PORT，會覆寫這個值，
# 所以固定 port 不會讓平行跑的整合測試互相搶。
server.port=${ORDER_PROMISING_PORT:28290}
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=${ORDER_PROMISING_KAFKA_BOOTSTRAP_SERVERS:localhost:28292}
spring.kafka.consumer.group-id=order-promising-allocation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
# 外部部署可將 file:/... basenames 放在 classpath fallback 前面，以 ConfigMap 或 volume 覆蓋翻譯。
archone.web.validation.message-basenames=${ARCHONE_VALIDATION_MESSAGE_BASENAMES:classpath:i18n/validation/constraints_template,classpath:i18n/validation/problem_detail,classpath:i18n/inventory/request_field,classpath:i18n/fulfillment/request_field}
archone.web.validation.message-cache-duration=${ARCHONE_VALIDATION_MESSAGE_CACHE_DURATION:5m}
archone.allocation.reconciliation-scheduler-enabled=true
archone.allocation.writer-mode=allocation
archone.fulfillment.orchestration-mode=${ORDER_PROMISING_FULFILLMENT_ORCHESTRATION_MODE:events}
archone.temporal.target=${ORDER_PROMISING_TEMPORAL_TARGET:localhost:7233}
archone.temporal.namespace=${ORDER_PROMISING_TEMPORAL_NAMESPACE:default}
# 現階段由三個環境共用的模擬 WMS 自動推進 Shipment；未來接真實 WMS entrypoint 後再替換這個 driver。
archone.wms.simulation.enabled=${ORDER_PROMISING_WMS_SIMULATION_ENABLED:true}
archone.wms.simulation.processing-delay=${ORDER_PROMISING_WMS_SIMULATION_PROCESSING_DELAY:10s}
archone.wms.simulation.batch-limit=${ORDER_PROMISING_WMS_SIMULATION_BATCH_LIMIT:100}
archone.wms.simulation.cancellation-batch-limit=${ORDER_PROMISING_WMS_SIMULATION_CANCELLATION_BATCH_LIMIT:100}
archone.wms.simulation.scheduler-initial-delay-ms=${ORDER_PROMISING_WMS_SIMULATION_INITIAL_DELAY_MS:1000}
archone.wms.simulation.scheduler-delay-ms=${ORDER_PROMISING_WMS_SIMULATION_SCAN_DELAY_MS:1000}
