server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=${ARCHONE_DB_URL:jdbc:postgresql://localhost:28891/order_promising}
spring.datasource.username=${ARCHONE_DB_USERNAME:order_promising}
spring.datasource.password=${ARCHONE_DB_PASSWORD:order_promising}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.kafka.bootstrap-servers=${ARCHONE_KAFKA_BOOTSTRAP_SERVERS:localhost:28892}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=true
archone.fulfillment.orchestration-mode=events
archone.business-zone=${ARCHONE_BUSINESS_ZONE:Asia/Taipei}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
