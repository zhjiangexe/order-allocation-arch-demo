plugins {
    alias(libs.plugins.java)
    alias(libs.plugins.spring.boot)
}

description = 'order-promising'

sourceSets {
    sit {
        // 也吃 test 的 output，讓兩個 source set 共用測試 fixture（例如 OrderFixtures）。
        // 否則每個 fixture 都要複製一份到 sit，而複製出來的兩份會各自漂移。
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }

    correctnessE2e {
        // Full-path correctness tests are repository-level specifications, but they execute the
        // real order-promising application. Keep their sources under e2e/spec while letting this
        // deployable own the classpath and Gradle lifecycle.
        java.srcDir rootProject.file('e2e/spec/src/test/java')
        resources.srcDir rootProject.file('e2e/spec/src/test/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    sitImplementation.extendsFrom testImplementation
    sitRuntimeOnly.extendsFrom testRuntimeOnly
    correctnessE2eImplementation.extendsFrom sitImplementation
    correctnessE2eRuntimeOnly.extendsFrom sitRuntimeOnly
}

dependencies {
    implementation project(':foundation')
    implementation project(':contracts')
    implementation project(':messaging:messaging-api')
    implementation project(':messaging:messaging-events')
    // Optional Tram-style local retry around the complete consumer transaction.
    implementation project(':messaging:messaging-spring-optimistic-locking')
    // This deployable both publishes and consumes, so it uses the all-in-one convenience starter.
    implementation project(':messaging:messaging-spring-boot-starter')
    implementation project(':platform-infrastructure')

    implementation libs.spring.boot.starter.actuator
    implementation libs.spring.boot.starter.data.jpa
    implementation libs.spring.boot.starter.flyway
    implementation libs.spring.boot.starter.kafka
    implementation libs.spring.boot.starter.opentelemetry
    implementation libs.spring.boot.starter.webmvc
    implementation libs.spring.cloud.starter.circuitbreaker.resilience4j
    implementation libs.bundles.spring.modulith
    implementation libs.jackson.datatype.jsr310

    developmentOnly libs.spring.boot.devtools
    runtimeOnly libs.micrometer.registry.otlp
    runtimeOnly libs.micrometer.registry.prometheus
    runtimeOnly libs.flyway.database.postgresql
    runtimeOnly libs.postgresql
    annotationProcessor libs.spring.boot.configuration.processor

    testImplementation libs.spring.boot.starter.actuator.test
    testImplementation libs.spring.boot.starter.data.jpa.test
    testImplementation libs.spring.boot.starter.opentelemetry.test
    testImplementation libs.spring.boot.starter.webmvc.test
    testImplementation libs.spring.modulith.starter.test
    testImplementation project(':messaging:messaging-test-support')
    testRuntimeOnly libs.junit.platform.launcher

    sitImplementation libs.spring.boot.testcontainers
    sitImplementation libs.testcontainers.postgresql
    sitImplementation libs.testcontainers.kafka
    sitImplementation libs.kafka.clients
}

tasks.register('sit', Test) {
    group = 'verification'
    description = 'Runs system integration tests against PostgreSQL Testcontainers.'
    testClassesDirs = sourceSets.sit.output.classesDirs
    classpath = sourceSets.sit.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.register('correctnessE2e', Test) {
    group = 'verification'
    description = 'Runs the real Outbox/Debezium/Kafka/Inbox correctness specifications.'
    testClassesDirs = sourceSets.correctnessE2e.output.classesDirs
    classpath = sourceSets.correctnessE2e.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    shouldRunAfter tasks.named('sit')
}

tasks.named('check') {
    dependsOn tasks.named('sit')
}
