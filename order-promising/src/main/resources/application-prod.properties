# Production profile. Activate through jvm-prod.options or SPRING_PROFILES_ACTIVE=prod.
# Database credentials and Kafka bootstrap servers intentionally have no local defaults.

server.port=${ORDER_PROMISING_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${ORDER_PROMISING_SHUTDOWN_TIMEOUT:30s}

# bootJar excludes the developmentOnly dependency. These guards also keep bootRun + prod lean.
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

spring.datasource.url=${ORDER_PROMISING_DB_URL}
spring.datasource.username=${ORDER_PROMISING_DB_USERNAME}
spring.datasource.password=${ORDER_PROMISING_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${ORDER_PROMISING_DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${ORDER_PROMISING_DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${ORDER_PROMISING_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${ORDER_PROMISING_DB_VALIDATION_TIMEOUT_MS:5000}

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${ORDER_PROMISING_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.listener.concurrency=${ORDER_PROMISING_KAFKA_CONCURRENCY:1}
spring.kafka.listener.ack-mode=batch
spring.kafka.listener.missing-topics-fatal=${ORDER_PROMISING_KAFKA_MISSING_TOPICS_FATAL:true}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.allow.auto.create.topics=${ORDER_PROMISING_KAFKA_ALLOW_AUTO_CREATE_TOPICS:false}

# Scale these values only after the database pool, topic partitions, and hot-stock contention agree.
archone.business-zone=${ORDER_PROMISING_BUSINESS_ZONE:Asia/Taipei}
archone.allocation.partition-key-strategy=${ORDER_PROMISING_PARTITION_KEY_STRATEGY:order-id}
archone.allocation.waiting-demand-batch-limit=${ORDER_PROMISING_WAITING_DEMAND_BATCH_LIMIT:200}
archone.allocation.reconciliation-scheduler-enabled=${ORDER_PROMISING_RECONCILIATION_ENABLED:true}
archone.allocation.reconciliation-scheduler-scope-limit=${ORDER_PROMISING_RECONCILIATION_SCOPE_LIMIT:200}
archone.allocation.reconciliation-scheduler-initial-delay-ms=${ORDER_PROMISING_RECONCILIATION_INITIAL_DELAY_MS:30000}
archone.allocation.reconciliation-scheduler-delay-ms=${ORDER_PROMISING_RECONCILIATION_DELAY_MS:30000}

# Keep this port private to the platform network; the application does not add endpoint security.
management.server.port=${ORDER_PROMISING_MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Do not create background exporters unless a collector is deliberately configured.
management.otlp.metrics.export.enabled=${ORDER_PROMISING_OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${ORDER_PROMISING_OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.tracing.export.enabled=${ORDER_PROMISING_TRACING_ENABLED:false}
management.tracing.export.otlp.enabled=${ORDER_PROMISING_OTLP_TRACING_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${ORDER_PROMISING_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=${ORDER_PROMISING_TRACING_SAMPLING_PROBABILITY:0.1}

spring.main.banner-mode=off
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN
