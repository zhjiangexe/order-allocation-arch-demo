spring.application.name=order-promising

# host port 一律 2829x（見 e2e/perf/README.md）。SIT 用 RANDOM_PORT，會覆寫這個值，
# 所以固定 port 不會讓平行跑的整合測試互相搶。
server.port=${ORDER_PROMISING_PORT:28290}
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=none
spring.kafka.bootstrap-servers=${ORDER_PROMISING_KAFKA_BOOTSTRAP_SERVERS:localhost:28292}
spring.kafka.consumer.group-id=order-promising-allocation
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.listener.missing-topics-fatal=false
archone.allocation.reconciliation-scheduler-enabled=true
