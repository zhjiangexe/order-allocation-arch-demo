name: order-promising-e2e-perf

# Infra-only stack for e2e/perf (and, later, e2e/spec): PostgreSQL + Kafka (KRaft) +
# Kafka Connect/Debezium. The order-promising app itself is NOT containerized here —
# run it on the host (./gradlew :order-promising:bootRun --args='--spring.profiles.active=dev')
# so it picks up the default localhost:5432 / localhost:9092 already baked into
# application-dev.properties / application.properties with zero extra config.
#
# Kafka listener wiring mirrors the Testcontainers config already proven in
# order-promising's OutboxCdcIntegrationTest (same image, same CLUSTER_ID, same KRaft
# single-node env vars) so the Debezium Outbox Event Router connector config can be
# reused verbatim: kafka-connect reaches the broker at kafka:19092.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_promising
      POSTGRES_USER: order_promising
      POSTGRES_PASSWORD: order_promising
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_promising -d order_promising"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka-native:4.1.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL: host access (k6/app running on the developer machine), advertised as
      #   localhost:9092 to match the app's existing default bootstrap-servers.
      # INTERNAL: container-to-container access (kafka-connect), advertised as
      #   kafka:19092 to match the existing OutboxCdcIntegrationTest connector config.
      # BROKER/CONTROLLER: inter-broker and KRaft controller traffic (single-node).
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9094,BROKER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9093,INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      # Default partition count for auto-created topics (ordering.order-events,
      # inventory.stock-events). 1 is Kafka's own out-of-the-box default and makes
      # every consumer group here accidentally single-threaded regardless of listener
      # concurrency — see ../README.md for why this needs to be >1 for a meaningful
      # v1 optimistic-lock baseline.
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: "9223372036854775807"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
    healthcheck:
      # apache/kafka-native ships no bin/*.sh CLI tooling (it's the GraalVM native-image
      # variant), so a plain TCP check is what's actually available in the image.
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: order-promising-connect
      CONFIG_STORAGE_TOPIC: order_promising_connect_config
      OFFSET_STORAGE_TOPIC: order_promising_connect_offsets
      STATUS_STORAGE_TOPIC: order_promising_connect_status
    ports:
      - "8083:8083"
