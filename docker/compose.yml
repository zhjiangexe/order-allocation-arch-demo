name: ${ARCHONE_COMPOSE_PROJECT:-archone-dev}

services:
  monolith:
    image: ${ARCHONE_IMAGE:-archone-monolith}:${ARCHONE_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        JAVA_VERSION: ${JAVA_VERSION:-25}
        APP_VERSION: ${ARCHONE_IMAGE_TAG:-dev}
    env_file:
      - ${ARCHONE_RUNTIME_ENV_FILE:-./env/dev.env}
    ports:
      - "${ARCHONE_HTTP_BIND_ADDRESS:-0.0.0.0}:${ARCHONE_HTTP_PORT:-28290}:8080"
      - "${ARCHONE_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${ARCHONE_MANAGEMENT_PORT:-28295}:8081"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: ${ARCHONE_STOP_GRACE_PERIOD:-40s}
    logging:
      driver: json-file
      options:
        max-size: ${ARCHONE_LOG_MAX_SIZE:-10m}
        max-file: "${ARCHONE_LOG_MAX_FILES:-5}"
