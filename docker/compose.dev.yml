services:
  monolith:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ORDER_PROMISING_FULFILLMENT_ORCHESTRATION_MODE: ${ORDER_PROMISING_FULFILLMENT_ORCHESTRATION_MODE:-events}
      ORDER_PROMISING_TEMPORAL_TARGET: ${ORDER_PROMISING_TEMPORAL_TARGET:-temporal:7233}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
        required: false

  temporal:
    profiles: ["temporal"]
    image: temporalio/temporal:1.8.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "127.0.0.1:${ARCHONE_TEMPORAL_PORT:-28294}:7233"
      - "127.0.0.1:${ARCHONE_TEMPORAL_UI_PORT:-28296}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_PROMISING_DB_NAME:-order_promising}
      POSTGRES_USER: ${ORDER_PROMISING_DB_USERNAME:-order_promising}
      POSTGRES_PASSWORD: ${ORDER_PROMISING_DB_PASSWORD:-order_promising}
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "127.0.0.1:${ARCHONE_POSTGRES_PORT:-28291}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${ORDER_PROMISING_DB_USERNAME:-order_promising} -d ${ORDER_PROMISING_DB_NAME:-order_promising}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka-native:4.1.2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9094,BROKER://0.0.0.0:9093,INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9093,INTERNAL://kafka:19092,EXTERNAL://${ARCHONE_KAFKA_ADVERTISED_HOST:-localhost}:${ARCHONE_KAFKA_PORT:-28292}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:${ARCHONE_KAFKA_PORT:-28292}:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-connect:
    image: quay.io/debezium/connect:3.5.2.Final
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: archone-dev-connect
      CONFIG_STORAGE_TOPIC: archone_dev_connect_config
      OFFSET_STORAGE_TOPIC: archone_dev_connect_offsets
      STATUS_STORAGE_TOPIC: archone_dev_connect_status
    ports:
      - "127.0.0.1:${ARCHONE_CONNECT_PORT:-28293}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 本機觀察工具：查看 topic、partition、message key、consumer group 與 Debezium connector。
  # 不參與事件處理；stage/prod 不會載入 compose.dev.yml，因此不會對外暴露管理介面。
  kafka-ui:
    image: ${ARCHONE_KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: archone-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: archone-dev-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    ports:
      - "127.0.0.1:${ARCHONE_KAFKA_UI_PORT:-28297}:8080"
    restart: unless-stopped

  connector-init:
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    depends_on:
      monolith:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CONNECTOR_NAME: archone-dev-outbox
      SLOT_NAME: archone_dev_outbox_slot
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${ORDER_PROMISING_DB_NAME:-order_promising}
      DB_USERNAME: ${ORDER_PROMISING_DB_USERNAME:-order_promising}
      DB_PASSWORD: ${ORDER_PROMISING_DB_PASSWORD:-order_promising}
    volumes:
      - ../scripts/register-outbox-connector.sh:/scripts/register-outbox-connector.sh:ro
    entrypoint: ["/bin/sh", "/scripts/register-outbox-connector.sh"]

volumes:
  postgres-data:
