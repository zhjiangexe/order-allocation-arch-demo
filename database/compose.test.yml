# Disposable database for migration verification; never uses development volumes.
services:
  database-migrate:
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/migration_test
      FLYWAY_USER: migration_test
      FLYWAY_PASSWORD: migration_test
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: migration_test
      POSTGRES_PASSWORD: migration_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_test -d migration_test"]
      interval: 2s
      timeout: 5s
      retries: 30
